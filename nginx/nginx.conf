# Multi-platform downloader edge configuration.
#
# Serves the static frontend, proxies /api to the FastAPI service, and upgrades
# /ws to a WebSocket. One server block handles the apex domain and every
# platform subdomain; the subdomain is recorded by the API for logging, but
# access is controlled by the URL allowlist, never by the Host header.

upstream api_backend {
    server api:8000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Large downloads need generous limits and no buffering.
    client_max_body_size 8m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout 3600s;

    gzip on;
    gzip_types text/css application/javascript application/json text/html;
    gzip_min_length 1024;

    # Don't advertise the nginx version.
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Downloads stream; buffering would stall progress reporting.
        proxy_buffering off;
    }

    # WebSocket progress streaming. A dedicated location is needed so the
    # Upgrade and Connection headers are forwarded and the read timeout is
    # long enough to outlive a large download.
    location /ws/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Long-lived static assets get a far-future expiry.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
