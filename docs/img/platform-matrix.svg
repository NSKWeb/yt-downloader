<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="mxTitle mxDesc" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="mxTitle">Platform support matrix</title>
  <desc id="mxDesc">Each of the six supported platforms with its maximum video quality, the number of audio formats offered, and whether it supports playlists, subtitles, images, and public content only.</desc>

  <rect width="1000" height="470" rx="16" fill="#f6f8fa"/>

  <text x="40" y="46" font-size="21" font-weight="700" fill="#1f2328">Platform support matrix</text>
  <text x="40" y="70" font-size="13" fill="#57606a">Capabilities come from the platform registry, so the UI only offers what the platform actually publishes.</text>

  <!-- Header -->
  <rect x="40" y="92" width="920" height="40" rx="8" fill="#1f2328"/>
  <text x="62" y="117" font-size="12.5" font-weight="600" fill="#ffffff">Platform</text>
  <text x="230" y="117" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">Max video</text>
  <text x="360" y="117" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">Audio</text>
  <text x="480" y="117" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">Playlist</text>
  <text x="600" y="117" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">Subtitles</text>
  <text x="710" y="117" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">Image</text>
  <text x="855" y="117" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">Public only</text>

  <!-- Rows -->
  <g font-size="13">
    <rect x="40" y="132" width="920" height="46" fill="#ffffff"/>
    <text x="62" y="160" font-weight="600" fill="#1f2328">YouTube</text>
    <text x="230" y="160" fill="#0969da" text-anchor="middle" font-weight="600">8K · 4320p</text>
    <text x="360" y="160" fill="#57606a" text-anchor="middle">7 formats</text>
    <text x="480" y="160" fill="#1a7f37" text-anchor="middle">Yes</text>
    <text x="600" y="160" fill="#1a7f37" text-anchor="middle">Yes</text>
    <text x="710" y="160" fill="#8c959f" text-anchor="middle">—</text>
    <text x="855" y="160" fill="#8c959f" text-anchor="middle">—</text>

    <rect x="40" y="178" width="920" height="46" fill="#f6f8fa"/>
    <text x="62" y="206" font-weight="600" fill="#1f2328">Instagram</text>
    <text x="230" y="206" fill="#57606a" text-anchor="middle">1080p</text>
    <text x="360" y="206" fill="#57606a" text-anchor="middle">7 formats</text>
    <text x="480" y="206" fill="#8c959f" text-anchor="middle">—</text>
    <text x="600" y="206" fill="#8c959f" text-anchor="middle">—</text>
    <text x="710" y="206" fill="#8c959f" text-anchor="middle">—</text>
    <text x="855" y="206" fill="#bf8700" text-anchor="middle" font-weight="600">Login wall</text>

    <rect x="40" y="224" width="920" height="46" fill="#ffffff"/>
    <text x="62" y="252" font-weight="600" fill="#1f2328">Facebook</text>
    <text x="230" y="252" fill="#57606a" text-anchor="middle">1080p</text>
    <text x="360" y="252" fill="#57606a" text-anchor="middle">7 formats</text>
    <text x="480" y="252" fill="#8c959f" text-anchor="middle">—</text>
    <text x="600" y="252" fill="#8c959f" text-anchor="middle">—</text>
    <text x="710" y="252" fill="#8c959f" text-anchor="middle">—</text>
    <text x="855" y="252" fill="#bf8700" text-anchor="middle" font-weight="600">Login wall</text>

    <rect x="40" y="270" width="920" height="46" fill="#f6f8fa"/>
    <text x="62" y="298" font-weight="600" fill="#1f2328">X (Twitter)</text>
    <text x="230" y="298" fill="#57606a" text-anchor="middle">1080p</text>
    <text x="360" y="298" fill="#57606a" text-anchor="middle">7 formats</text>
    <text x="480" y="298" fill="#8c959f" text-anchor="middle">—</text>
    <text x="600" y="298" fill="#8c959f" text-anchor="middle">—</text>
    <text x="710" y="298" fill="#8c959f" text-anchor="middle">—</text>
    <text x="855" y="298" fill="#8c959f" text-anchor="middle">—</text>

    <rect x="40" y="316" width="920" height="46" fill="#ffffff"/>
    <text x="62" y="344" font-weight="600" fill="#1f2328">Pinterest</text>
    <text x="230" y="344" fill="#57606a" text-anchor="middle">1080p</text>
    <text x="360" y="344" fill="#57606a" text-anchor="middle">7 formats</text>
    <text x="480" y="344" fill="#8c959f" text-anchor="middle">—</text>
    <text x="600" y="344" fill="#8c959f" text-anchor="middle">—</text>
    <text x="710" y="344" fill="#1a7f37" text-anchor="middle">Yes</text>
    <text x="855" y="344" fill="#bf8700" text-anchor="middle" font-weight="600">Public pins</text>

    <rect x="40" y="362" width="920" height="46" fill="#f6f8fa"/>
    <text x="62" y="390" font-weight="600" fill="#1f2328">TikTok</text>
    <text x="230" y="390" fill="#57606a" text-anchor="middle">1080p</text>
    <text x="360" y="390" fill="#57606a" text-anchor="middle">7 formats</text>
    <text x="480" y="390" fill="#8c959f" text-anchor="middle">—</text>
    <text x="600" y="390" fill="#8c959f" text-anchor="middle">—</text>
    <text x="710" y="390" fill="#8c959f" text-anchor="middle">—</text>
    <text x="855" y="390" fill="#8c959f" text-anchor="middle">—</text>
  </g>

  <rect x="40" y="408" width="920" height="1" fill="#d0d7de"/>
  <text x="40" y="432" font-size="11.5" fill="#57606a">Audio formats on every platform: mp3, m4a, wav, flac, opus, aac, ogg. Bitrate 128–320 kbps or best available.</text>
  <text x="40" y="452" font-size="11.5" fill="#57606a">"Login wall" means the platform gates most content behind an account this service does not use, so expect failures there.</text>
</svg>
