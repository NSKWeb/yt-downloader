<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="pipeTitle pipeDesc" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="pipeTitle">Format selection and download pipeline</title>
  <desc id="pipeDesc">A pasted URL is resolved by yt-dlp into a format list. The chosen mode and quality produce a yt-dlp format selector, which decides whether streams are muxed by FFmpeg or converted to an audio format.</desc>

  <defs>
    <marker id="stepArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/>
    </marker>
  </defs>

  <rect width="1000" height="520" rx="16" fill="#f6f8fa"/>

  <text x="40" y="46" font-size="21" font-weight="700" fill="#1f2328">Format selection and download pipeline</text>
  <text x="40" y="70" font-size="13" fill="#57606a">The format string is the part that decides both speed and output quality.</text>

  <!-- Left: inputs -->
  <rect x="40" y="100" width="250" height="120" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="60" y="128" font-size="14" font-weight="600" fill="#1f2328">What the user chose</text>
  <text x="60" y="154" font-size="12" fill="#57606a">mode</text>
  <text x="270" y="154" font-size="12" fill="#0969da" text-anchor="end" font-family="ui-monospace, monospace">video | audio | image</text>
  <text x="60" y="178" font-size="12" fill="#57606a">quality</text>
  <text x="270" y="178" font-size="12" fill="#0969da" text-anchor="end" font-family="ui-monospace, monospace">720p … 4320p | best</text>
  <text x="60" y="202" font-size="12" fill="#57606a">audio format</text>
  <text x="270" y="202" font-size="12" fill="#0969da" text-anchor="end" font-family="ui-monospace, monospace">mp3, m4a, wav, …</text>

  <line x1="290" y1="160" x2="330" y2="160" stroke="#8c959f" stroke-width="2" marker-end="url(#stepArrow)"/>

  <!-- Middle: selector -->
  <rect x="336" y="100" width="300" height="120" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="356" y="128" font-size="14" font-weight="600" fill="#1f2328">yt-dlp format selector</text>
  <text x="356" y="152" font-size="11.5" fill="#57606a">built in build_format_selector()</text>
  <rect x="356" y="162" width="262" height="46" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="366" y="180" font-size="11.5" fill="#1f2328" font-family="ui-monospace, monospace">bestvideo[height&lt;=2160]+bestaudio</text>
  <text x="366" y="198" font-size="11.5" fill="#57606a" font-family="ui-monospace, monospace">/best[height&lt;=2160]</text>

  <line x1="636" y1="160" x2="676" y2="160" stroke="#8c959f" stroke-width="2" marker-end="url(#stepArrow)"/>

  <!-- Right: branch -->
  <rect x="682" y="100" width="278" height="120" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="702" y="128" font-size="14" font-weight="600" fill="#1f2328">Branch</text>
  <text x="702" y="152" font-size="12" fill="#57606a">video → mux with FFmpeg to mp4</text>
  <text x="702" y="174" font-size="12" fill="#57606a">audio → extract + convert</text>
  <text x="702" y="196" font-size="12" fill="#57606a">image → save as-is</text>

  <!-- Explanation rows -->
  <rect x="40" y="252" width="920" height="70" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="40" y="252" width="5" height="70" rx="2.5" fill="#0969da"/>
  <text x="66" y="278" font-size="13.5" font-weight="600" fill="#1f2328">Only YouTube gets the split-stream selector</text>
  <text x="66" y="300" font-size="12" fill="#57606a">Short-form platforms serve one muxed MP4. Asking for bestvideo+bestaudio makes yt-dlp fail or fall back, so they get a plain best[height&lt;=N].</text>

  <rect x="40" y="336" width="920" height="70" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="40" y="336" width="5" height="70" rx="2.5" fill="#1a7f37"/>
  <text x="66" y="362" font-size="13.5" font-weight="600" fill="#1f2328">aria2c is added only when it can help</text>
  <text x="66" y="384" font-size="12" fill="#57606a">16 connections speed up a single direct media stream. For segmented HLS/DASH downloads yt-dlp already parallelises, and aria2c is a no-op.</text>

  <rect x="40" y="420" width="920" height="70" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="40" y="420" width="5" height="70" rx="2.5" fill="#8250df"/>
  <text x="66" y="446" font-size="13.5" font-weight="600" fill="#1f2328">Choosing the container avoids a re-encode</text>
  <text x="66" y="468" font-size="12" fill="#57606a">Asking for mp4 lets FFmpeg copy the streams. Asking for a container the source codec does not fit forces a full re-encode, which is far slower.</text>
</svg>
