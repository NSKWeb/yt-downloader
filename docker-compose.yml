services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env.example
    environment:
      REDIS_HOST: redis
      DOWNLOAD_DIR: /downloads
    volumes:
      - downloads:/downloads
    depends_on:
      redis:
        condition: service_healthy
    # The image ships no curl, so probe with the interpreter that is already
    # there. This is what lets nginx wait for a live API instead of racing it.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    expose:
      - "8000"

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["arq", "app.workers.tasks.WorkerSettings"]
    env_file: ./backend/.env.example
    environment:
      REDIS_HOST: redis
      DOWNLOAD_DIR: /downloads
    volumes:
      - downloads:/downloads
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "12000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  redis-data:
  downloads:
